<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restored Daily Ministries</title>

<style>
:root{
--navy:#13234a;
--gold:#cbb073;
--cream:#fff9ef;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f8fbff;
overflow-x:hidden;
}

.site-header{
background:linear-gradient(180deg,#13234a,#162b59);
padding:28px 18px 34px;
border-bottom:1px solid rgba(203,176,115,.35);
}

.header-inner{
max-width:1280px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:30px;
}

.logo-wrap{
display:flex;
align-items:center;
gap:22px;
text-decoration:none;
}

.logo-wrap img{
width:165px;
height:165px;
object-fit:contain;
flex-shrink:0;
filter:drop-shadow(0 6px 12px rgba(0,0,0,.25));
}

.logo-text{
font-family:Georgia,serif;
font-weight:800;
font-size:clamp(28px,2.5vw,44px);
line-height:.92;
letter-spacing:1px;
color:var(--cream);
}

.nav-links{
display:flex;
flex-wrap:wrap;
justify-content:flex-end;
gap:14px;
}

.nav-links a{
text-decoration:none;
color:var(--cream);
font-weight:800;
padding:14px 24px;
border-radius:999px;
border:2px solid rgba(203,176,115,.7);
background:rgba(255,255,255,.04);
font-size:16px;
white-space:nowrap;
}

.hero{
height:420px;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url("hero-background.jpg") center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.hero h1{
font-family:Georgia,serif;
font-size:clamp(52px,6vw,90px);
line-height:1;
color:white;
text-shadow:0 5px 18px rgba(0,0,0,.4);
}

@media(max-width:900px){

.header-inner{
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.logo-wrap{
flex-direction:column;
gap:16px;
}

.logo-wrap img{
width:220px;
height:220px;
}

.logo-text{
font-size:58px;
}

.nav-links{
justify-content:center;
width:100%;
}

.nav-links a{
font-size:18px;
padding:16px 24px;
}
}

@media(max-width:600px){

.site-header{
padding:30px 16px 36px;
}

.logo-wrap img{
width:250px;
height:250px;
}

.logo-text{
font-size:36px;
}

.nav-links{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
width:100%;
}

.nav-links a{
width:100%;
text-align:center;
padding:18px 10px;
font-size:17px;
}

.hero{
height:340px;
}

.hero h1{
font-size:56px;
}
}
</style>
</head>

<body>

<header class="site-header">

<div class="header-inner">

<a href="index.html" class="logo-wrap">
<img src="logo.png" alt="Restored Daily Ministries Logo">

<div class="logo-text">
RESTORED<br>
DAILY<br>
MINISTRIES
</div>
</a>

<nav class="nav-links">
<a href="index.html">Home</a>
<a href="mission.html">Mission</a>
<a href="devotional.html">Devotionals</a>
<a href="disciple.html">Lessons</a>
<a href="preaching.html">Live Preaching</a>
<a href="podcast.html">Podcast</a>
<a href="prayer.html">Prayer</a>
</nav>

</div>
</header>

<section class="hero">
<h1>Restored Daily Ministries</h1>
</section>

</body>
</html>
