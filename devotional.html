<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Devotionals | Restored Daily Ministries</title>

  <style>

    :root {

      --deep: #101A2E; --earth: #1F4F46; --card: #F9F2E4; --cream: #FFF8EA;

      --gold: #D7A84F; --lightgold: #F8D987; --amber: #F2C76E; --royal: #13233F;

      --text: #2B394F; --sky: #EEF7FF; --aqua: #EAF4F1; --paper: #FFF9EC;

      --softline: rgba(215,168,79,.18);

    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      background:

        radial-gradient(circle at 50% 0%, rgba(248,217,135,.30), transparent 34%),

        linear-gradient(180deg, #EEF7FF 0%, #FFF8EA 34%, #EAF4F1 68%, #101A2E 100%);

      color: var(--text);

      line-height: 1.7;

    }

    a { color: inherit; }



    .site-header {

      position: sticky; top: 0; z-index: 100;

      background: rgba(16,26,46,.96);

      border-bottom: 1px solid rgba(248,217,135,.34);

      backdrop-filter: blur(12px);

    }

    .nav-wrap {

      max-width: 1320px; margin: 0 auto; padding: 12px 22px;

      display: flex; align-items: center; justify-content: space-between;

      gap: 22px; position: relative;

    }

    .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; flex: 0 1 auto; min-width: 0; }

    .brand-emblem {

      width: 82px; height: 82px; object-fit: contain; display: block;

      background: transparent; filter: drop-shadow(0 4px 8px rgba(0,0,0,.25));

      flex: 0 0 auto;

    }

    .brand-wordmark { display: flex; flex-direction: column; line-height: 1; min-width: 0; }

    .brand-main {

      font-family: Georgia,'Times New Roman',serif; color: var(--cream);

      font-size: clamp(28px,2.45vw,44px); font-weight: 700;

      letter-spacing: 1.2px; text-transform: uppercase;

      text-shadow: 0 2px 5px rgba(0,0,0,.28); white-space: nowrap;

    }

    .brand-sub {

      display: flex; align-items: center; gap: 12px; margin-top: 8px;

      font-family: Georgia,'Times New Roman',serif; color: var(--gold);

      font-size: clamp(15px,1.15vw,21px); font-weight: 700;

      letter-spacing: 6px; text-transform: uppercase; white-space: nowrap;

    }

    .brand-sub::before, .brand-sub::after {

      content: ""; width: 46px; height: 2px; border-radius: 999px;

      background: linear-gradient(90deg, transparent, var(--gold)); flex: 0 0 auto;

    }

    .brand-sub::after { background: linear-gradient(90deg, var(--gold), transparent); }



    .nav-control { position: relative; flex: 0 0 auto; display: flex; justify-content: flex-end; }

    .menu-toggle {

      display: inline-flex; align-items: center; justify-content: center; gap: 10px;

      border: 2px solid rgba(248,217,135,.62); border-radius: 999px;

      background: rgba(255,255,255,.06); color: var(--cream);

      padding: 11px 18px; font-weight: 900; font-size: 14px;

      letter-spacing: .4px; cursor: pointer; transition: .2s ease;

    }

    .menu-toggle:hover, .nav-control.is-open .menu-toggle {

      background: rgba(248,217,135,.18); color: var(--lightgold);

      box-shadow: 0 0 18px rgba(214,170,99,.18);

    }

    .menu-icon { width: 18px; height: 12px; display: inline-flex; flex-direction: column; justify-content: space-between; }

    .menu-icon span { display: block; height: 2px; border-radius: 999px; background: currentColor; }

    .dropdown-menu {

      position: absolute; top: calc(100% + 12px); right: 0; width: 270px;

      padding: 14px; border-radius: 22px; border: 1px solid rgba(248,217,135,.42);

      background: linear-gradient(180deg, rgba(16,26,46,.98), rgba(9,17,31,.98));

      box-shadow: 0 24px 60px rgba(0,0,0,.34);

      display: grid; gap: 8px; opacity: 0; visibility: hidden;

      transform: translateY(-8px); pointer-events: none; transition: .2s ease;

    }

    .nav-control.is-open .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }

    .dropdown-menu a {

      text-decoration: none; color: var(--cream); padding: 12px 14px;

      border-radius: 14px; font-weight: 900; font-size: 14px;

      border: 1px solid rgba(248,217,135,.18); background: rgba(255,255,255,.04);

      transition: .2s ease;

    }

    .dropdown-menu a:hover, .dropdown-menu a.active {

      color: var(--lightgold); background: rgba(248,217,135,.16);

      border-color: rgba(248,217,135,.48);

    }



    h1, h2, h3 { font-family: Georgia,'Times New Roman',serif; margin: 0; line-height: 1.1; }



    .page-hero {

      min-height: 460px; padding: 100px 22px 88px;

      display: flex; flex-direction: column; align-items: center; justify-content: center;

      text-align: center;

      background:

        linear-gradient(rgba(16,26,46,.24), rgba(16,26,46,.66)),

        url('./hero-background.png?v=31') 82% 26% / cover no-repeat;

      border-bottom: 1px solid rgba(214,170,99,.25);

    }

    .page-hero h1 {

      max-width: 1100px; font-size: clamp(42px,8vw,82px);

      color: #fff5dd; text-shadow: 0 8px 28px rgba(0,0,0,.55);

    }

    .page-hero p {

      max-width: 920px; margin: 18px auto 0; font-size: clamp(18px,3vw,23px);

      color: #F7EEDB; font-weight: 700; text-shadow: 0 4px 14px rgba(0,0,0,.45);

    }



    .section {

      padding: 82px 22px;

      background: linear-gradient(180deg, #FFF8EA 0%, #EEF7FF 52%, #EAF4F1 100%);

      color: #13233F;

    }

    .section.alt { background: linear-gradient(180deg, #F7FBFF 0%, #FFF8EA 100%); }

    .container { max-width: 1160px; margin: 0 auto; }

    .section-title {

      text-align: center; font-size: clamp(38px,7vw,66px);

      color: #13233F; margin-bottom: 18px;

    }

    .section-text {

      max-width: 930px; margin: 0 auto; text-align: center;

      font-size: clamp(18px,3vw,22px); color: #2B394F;

    }



    .signup-section {

      background:

        radial-gradient(circle at 50% 0%, rgba(248,217,135,.22), transparent 42%),

        linear-gradient(180deg, #FFF8EA 0%, #EEF7FF 100%);

      border-bottom: 1px solid rgba(215,168,79,.22);

    }

    .signup-box {

      max-width: 980px; margin: 34px auto 0; padding: 38px;

      border-radius: 30px;

      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,248,234,.91));

      border: 1px solid rgba(214,170,99,.36);

      box-shadow: 0 22px 58px rgba(0,0,0,.12);

      text-align: center;

    }

    .signup-box p { color: #2B394F; font-size: 19px; margin: 0 auto 18px; max-width: 900px; }



    .btn, .read-more, .back-link {

      display: inline-flex; align-items: center; justify-content: center;

      padding: 12px 20px; border-radius: 999px;

      background: linear-gradient(135deg,#FFE39A,#D7A84F);

      color: var(--deep); text-decoration: none; font-weight: 900;

      border: 2px solid rgba(215,168,79,.78);

      box-shadow: 0 12px 28px rgba(215,168,79,.20);

      transition: .2s ease;

    }

    .btn { margin-top: 12px; padding: 15px 26px; }

    .btn:hover, .read-more:hover, .back-link:hover {

      transform: translateY(-2px);

      box-shadow: 0 16px 34px rgba(0,0,0,.16), 0 0 22px rgba(214,170,99,.22);

    }



    .archive-tools {

      max-width: 900px; margin: 34px auto 0;

      display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;

    }

    .search-input {

      width: min(100%,560px); padding: 15px 18px; border-radius: 999px;

      border: 2px solid rgba(215,168,79,.45); background: #fff;

      color: var(--royal); font-size: 16px;

      box-shadow: 0 12px 30px rgba(28,45,74,.08);

    }



    .archive-feed {

      max-width: 980px;

      margin: 44px auto 0;

      display: grid;

      gap: 18px;

    }

    .feed-entry {

      position: relative;

      display: grid;

      grid-template-columns: 180px 1fr auto;

      gap: 22px;

      align-items: center;

      padding: 30px 28px;

      border-radius: 30px;

      background: linear-gradient(145deg, rgba(255,248,234,.94), rgba(247,242,230,.90));

      border: 1.5px solid rgba(183,131,45,.30);

      box-shadow:

        0 10px 30px rgba(28,45,74,.08),

        inset 0 1px 0 rgba(255,255,255,.55);

      backdrop-filter: blur(3px);

      overflow: hidden;

      scroll-margin-top: 125px;

      transition: transform .18s ease, box-shadow .18s ease;

    }

    .feed-entry:hover {

      transform: translateY(-2px);

      box-shadow:

        0 16px 40px rgba(28,45,74,.12),

        inset 0 1px 0 rgba(255,255,255,.6);

    }

    .feed-entry::before {

      content: "";

      position: absolute;

      left: 28px;

      right: 28px;

      top: 0;

      height: 4px;

      border-radius: 999px;

      background: linear-gradient(90deg, rgba(215,168,79,.82), rgba(31,79,70,.45), rgba(215,168,79,.28));

    }

    .feed-date {

      color: #8A621D; background: rgba(248,217,135,.36);

      border: 1px solid rgba(215,168,79,.55);

      padding: 9px 13px; border-radius: 999px;

      font-size: 12px; font-weight: 900; text-transform: uppercase;

      letter-spacing: 1px; text-align: center; width: fit-content; max-width: 100%;

    }

    .feed-content h3 {

      color: var(--royal);

      font-size: clamp(24px,3vw,34px);

      margin: 0 0 10px;

    }

    .feed-preview {

      margin: 0;

      color: var(--text);

      font-size: 17px;

      line-height: 1.65;

    }

    .preview-scripture {

      display: block;

      font-weight: 800;

      color: #26334B;

    }

    .preview-thought {

      display: block;

      margin-top: 14px;

      color: #2B394F;

    }



    .loading, .empty, .error {

      max-width: 850px; margin: 34px auto 0; text-align: center;

      padding: 24px; border-radius: 24px;

      background: rgba(255,255,255,.85);

      border: 1px solid rgba(215,168,79,.32);

      color: var(--text);

    }



    .single-devotional {

      max-width: 900px;

      margin: 46px auto 0;

      background: linear-gradient(180deg, rgba(255,248,234,.96), rgba(247,242,230,.93));

      border: 1.5px solid rgba(183,131,45,.32);

      border-radius: 34px;
