<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restored Daily Ministries | Iron Sharpener</title>
<style>
:root{--navy:#061526;--deep:#020913;--royal:#0b1f38;--gold:#d7a84f;--bright:#f4c76c;--cream:#fff4d8;--paper:#fff9ec;--ink:#0d1a2f;--line:rgba(215,168,79,.45);--shadow:0 24px 70px rgba(0,0,0,.33)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;scroll-behavior:smooth}body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:radial-gradient(circle at 20% 0%,rgba(244,199,108,.22),transparent 28%),linear-gradient(145deg,#020913,#061526 48%,#0a223d);padding:10px}.shell{max-width:1480px;margin:0 auto;border:2px solid var(--gold);background:var(--paper);box-shadow:var(--shadow);overflow:hidden;border-radius:10px}.hero{background:linear-gradient(90deg,rgba(2,9,19,.98),rgba(6,21,38,.98),rgba(2,9,19,.98));color:#fff;display:grid;grid-template-columns:250px 1fr 270px;gap:24px;align-items:center;padding:20px 28px;border-bottom:2px solid var(--gold);position:relative}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 13% 48%,rgba(244,199,108,.18),transparent 22%),radial-gradient(circle at 50% 10%,rgba(255,255,255,.06),transparent 30%);pointer-events:none}.logoWrap{position:relative;z-index:1;width:230px;height:230px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:visible}.logo{width:218px;height:218px;object-fit:contain;object-position:center;display:block;border-radius:50%;filter:drop-shadow(0 14px 24px rgba(0,0,0,.45))}.heroMain{position:relative;z-index:1;text-align:center}.eyebrow{letter-spacing:9px;color:var(--bright);font-weight:800;font-size:18px;text-transform:uppercase;margin:0 0 8px}h1{font-size:76px;line-height:.9;margin:0;text-transform:uppercase;letter-spacing:2px;text-shadow:0 4px 0 rgba(0,0,0,.35)}.subtitle{font-size:28px;color:var(--bright);font-style:italic;margin:15px auto 22px;max-width:900px}.actions{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}button,.btn{border:1.5px solid var(--gold);background:linear-gradient(#f8d987,#d99f31);color:#061526;border-radius:12px;padding:13px 24px;font:800 17px Arial,sans-serif;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.16);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}button.secondary{background:#fff7e6}button.darkBtn{background:#061526;color:#fff}.verseCard{position:relative;z-index:1;border:1.5px solid rgba(215,168,79,.85);background:rgba(0,0,0,.18);padding:22px 18px;border-radius:10px;text-align:center;color:#fff5d7;align-self:center}.verseCard p{font-size:28px;font-style:italic;line-height:1.28;margin:0 0 18px}.verseCard strong{color:var(--bright);letter-spacing:3px;font-size:16px}.ribbon{background:#fff7e6;border-bottom:2px solid var(--gold);padding:16px;text-align:center;letter-spacing:8px;text-transform:uppercase;font-weight:800;color:#10213c;font-size:20px}.controls{display:grid;grid-template-columns:1.1fr .7fr .7fr .7fr .8fr auto;gap:26px;padding:20px 38px;background:#fff6e7;border-bottom:1px solid var(--line);align-items:end}label{display:block;font:800 13px Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#17304f;margin-bottom:8px}select,textarea{width:100%;border:1px solid rgba(215,168,79,.65);border-radius:8px;padding:12px;background:#fffaf0;color:var(--ink);font:18px Arial,sans-serif}textarea{resize:vertical;min-height:90px;line-height:1.45}.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:26px;padding:28px;background:linear-gradient(180deg,#fff9ec,#fff2d5)}.scripture{background:linear-gradient(180deg,#fffaf0,#fff7e6);border:1px solid var(--line);border-radius:10px;padding:30px 48px;position:relative;box-shadow:0 10px 30px rgba(70,40,0,.08);min-height:560px}.ref{text-align:center;text-transform:uppercase;font-size:38px;letter-spacing:5px;margin:0;color:#07172b;font-weight:800}.source{text-align:center;text-transform:uppercase;letter-spacing:4px;font:800 14px Arial,sans-serif;margin:8px 0 22px;color:#946216}.divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 26px;max-width:520px;position:relative}.divider:after{content:"◆";position:absolute;left:50%;top:-9px;transform:translateX(-50%);color:var(--gold);background:#fff7e6;padding:0 10px;font-size:14px}.verse{font-size:26px;line-height:1.5;margin:0 0 12px;color:#0b1730}.vnum{font-size:18px;color:#b37410;font-weight:bold;vertical-align:super;margin-right:10px}.verse.active{background:rgba(244,199,108,.26);outline:1px solid rgba(215,168,79,.45);border-radius:8px;padding:6px 10px;margin-left:-10px;margin-right:-10px}.navRow{display:flex;justify-content:space-between;margin-top:20px}.side{display:flex;flex-direction:column;gap:16px}.panel{background:rgba(255,250,240,.94);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 8px 22px rgba(70,40,0,.06)}.panel h3{margin:0 0 12px;font-size:22px;text-transform:uppercase;color:#17233d;border-bottom:1px solid var(--gold);padding-bottom:8px;letter-spacing:1px}.panel ul{margin:0 0 12px 22px;padding:0;line-height:1.5;font:17px Arial,sans-serif}.panelNote{font:700 13px Arial,sans-serif;color:#6d5a37;line-height:1.45;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.footer{background:#061526;color:#fff3cd;text-align:center;padding:18px;border-top:2px solid var(--gold);font-size:20px;line-height:1.5;display:flex;justify-content:center;gap:36px;align-items:center;flex-wrap:wrap}.footer .sep{width:2px;height:32px;background:var(--gold);display:inline-block}.footer strong{color:#fff}body.dark{--paper:#07172b;--ink:#fff2d7;background:#020913}body.dark .shell,body.dark .layout{background:#07172b}body.dark .scripture,body.dark .panel,body.dark select,body.dark textarea{background:#0d2139;color:#fff2d7}body.dark .controls,body.dark .ribbon{background:#0a1a30;color:#fff2d7}body.dark .source,body.dark label,body.dark .ref,body.dark .panel h3,body.dark .verse{color:#fff2d7}body.dark .divider:after{background:#0d2139}html.obs body{padding:0;background:#061526}html.obs .shell{max-width:none;border:0;border-radius:0;box-shadow:none}html.obs .controls,html.obs .side,html.obs .footer{display:none!important}html.obs .hero{grid-template-columns:145px 1fr;padding:12px 18px}html.obs .verseCard{display:none!important}html.obs .logoWrap{width:126px;height:126px}html.obs .logo{width:118px;height:118px}html.obs h1{font-size:50px}html.obs .subtitle{font-size:20px;margin-bottom:8px}html.obs .ribbon{display:block;padding:8px;font-size:15px}html.obs .layout{display:block;padding:0;background:#fff7e6}html.obs .scripture{border-radius:0;border-left:0;border-right:0;min-height:calc(100vh - 195px);padding:42px 90px}html.obs .verse{font-size:31px;line-height:1.65}html.obs .actions{display:flex!important;position:fixed;top:14px;right:14px;z-index:9999}html.obs .actions button:not(#obsBtn){display:none!important}html.obs #obsBtn{display:inline-flex!important;background:#fff7e6!important;color:#061526!important;border:2px solid #d7a84f!important}@media(max-width:1050px){.hero{grid-template-columns:1fr;text-align:center}.verseCard{display:block;max-width:520px;margin:0 auto}.controls{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}h1{font-size:52px}.logoWrap{width:174px;height:174px}.logo{width:162px;height:162px}}@media(max-width:650px){body{padding:0}.shell{border-radius:0;border-left:0;border-right:0}.hero{padding:16px 14px;gap:14px}h1{font-size:38px}.subtitle{font-size:19px}.eyebrow{letter-spacing:4px;font-size:13px}.controls{grid-template-columns:1fr;padding:16px}.layout{padding:16px}.scripture{padding:26px 24px}.verse{font-size:21px}.ref{font-size:25px}.ribbon{letter-spacing:3px;font-size:13px}.logoWrap{width:154px;height:154px}.logo{width:144px;height:144px}.footer{font-size:15px;gap:12px}.footer .sep{display:none}}
</style>
