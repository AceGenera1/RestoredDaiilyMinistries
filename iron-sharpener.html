<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restored Daily Iron Sharpener</title>
<style>
:root {
  --navy:#061526; --deep:#020913; --royal:#0b1f38; --gold:#d7a84f; --bright:#f4c76c; --cream:#fff4d8; --paper:#fff9ec; --ink:#0d1a2f; --muted:#6d5a37; --line:rgba(215,168,79,.45); --shadow:0 24px 70px rgba(0,0,0,.33);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;scroll-behavior:smooth}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:radial-gradient(circle at 20% 0%,rgba(244,199,108,.22),transparent 28%),linear-gradient(145deg,#020913,#061526 48%,#0a223d);padding:14px}
a{color:inherit}
.shell{max-width:1480px;margin:0 auto;border:2px solid var(--gold);background:var(--paper);box-shadow:var(--shadow);overflow:hidden;border-radius:10px}
.hero{background:linear-gradient(90deg,rgba(2,9,19,.96),rgba(6,21,38,.98),rgba(2,9,19,.96));color:#fff;display:grid;grid-template-columns:260px 1fr 300px;gap:24px;align-items:center;padding:22px 28px 20px;border-bottom:2px solid var(--gold);position:relative}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 13% 48%,rgba(244,199,108,.18),transparent 22%),radial-gradient(circle at 50% 10%,rgba(255,255,255,.06),transparent 30%);pointer-events:none}
.logoWrap{position:relative;z-index:1;display:flex;justify-content:center}
.logo{width:226px;height:226px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 18px 28px rgba(0,0,0,.45));border:2px solid var(--bright)}
.heroMain{position:relative;z-index:1;text-align:center}
.eyebrow{letter-spacing:10px;color:var(--bright);font-weight:800;font-size:17px;text-transform:uppercase;margin:0 0 5px}
h1{font-size:82px;line-height:.9;margin:0;text-transform:uppercase;letter-spacing:2px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.subtitle{font-size:27px;color:var(--bright);font-style:italic;margin:15px auto 22px;max-width:980px}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
button,.btn{border:1.5px solid var(--gold);background:linear-gradient(#f8d987,#d99f31);color:#061526;border-radius:12px;padding:12px 20px;font:800 16px Arial,sans-serif;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.16);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.secondary,.btn.secondary{background:#fff7e6}
button.darkBtn{background:#061526;color:#fff}
.verseCard{position:relative;z-index:1;border:1px solid rgba(215,168,79,.55);background:rgba(0,0,0,.18);padding:20px;border-radius:10px;text-align:center;color:#fff5d7}
.verseCard p{font-size:24px;font-style:italic;line-height:1.35;margin:0 0 12px}
.verseCard strong{color:var(--bright);letter-spacing:2px;font-size:15px}
.ribbon{background:#fff7e6;border-bottom:2px solid var(--gold);padding:13px;text-align:center;letter-spacing:7px;text-transform:uppercase;font-weight:800;color:#10213c}
.controls{display:grid;grid-template-columns:1.3fr .7fr .7fr .7fr .8fr auto;gap:16px;padding:18px 28px;background:#fff3d2;border-bottom:1px solid var(--line);align-items:end}
label{display:block;font:800 12px Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#17304f;margin-bottom:7px}
select,input,textarea{width:100%;border:1px solid rgba(215,168,79,.65);border-radius:10px;padding:12px;background:#fffaf0;color:var(--ink);font:16px Arial,sans-serif}
textarea{resize:vertical;min-height:100px;line-height:1.45}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;padding:26px 28px;background:linear-gradient(180deg,#fff9ec,#fff2d5)}
.scripture{background:linear-gradient(180deg,#fffaf0,#fff7e6);border:1px solid var(--line);border-radius:16px;padding:34px 52px;position:relative;box-shadow:0 10px 30px rgba(70,40,0,.08);min-height:600px}
.ref{text-align:center;text-transform:uppercase;font-size:34px;letter-spacing:2px;margin:0;color:#07172b;font-weight:800}
.source{text-align:center;text-transform:uppercase;letter-spacing:4px;font:800 13px Arial,sans-serif;margin:8px 0 22px;color:#31405a}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 26px;max-width:720px;position:relative}
.divider:after{content:"◆";position:absolute;left:50%;top:-9px;transform:translateX(-50%);color:var(--gold);background:#fff7e6;padding:0 10px;font-size:14px}
.verse{font-size:25px;line-height:1.62;margin:0 0 17px;color:#0b1730}
.vnum{font-size:16px;color:#c18516;font-weight:bold;vertical-align:super;margin-right:10px}
.verse.active{background:rgba(244,199,108,.26);outline:1px solid rgba(215,168,79,.45);border-radius:8px;padding:6px 10px;margin-left:-10px;margin-right:-10px}
.navArrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:60px;border-radius:10px;background:#061526;color:#fff;font-size:34px;padding:0;z-index:4}
.navArrow.left{left:10px} .navArrow.right{right:10px}
.side{display:flex;flex-direction:column;gap:18px}
.panel{background:rgba(255,250,240,.94);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 22px rgba(70,40,0,.06)}
.panel h3{margin:0 0 10px;font-size:20px;text-transform:uppercase;color:#17233d}
.panel ul{margin:0 0 12px 22px;padding:0;line-height:1.5}
.footer{background:#061526;color:#fff3cd;text-align:center;padding:18px;border-top:2px solid var(--gold);font-size:20px}
.footer span{color:var(--bright)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{font:800 13px Arial,sans-serif;padding:10px 12px;border-radius:8px;background:#fff7e6;border:1px solid var(--line);cursor:pointer}
.tab.active{background:#061526;color:#fff}
.tabContent{display:none} .tabContent.active{display:block}
.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.smallBtn{font-size:13px;padding:10px}
body.dark{--paper:#07172b;--ink:#fff2d7;background:#020913}
body.dark .shell, body.dark .layout{background:#07172b}
body.dark .scripture, body.dark .panel, body.dark select, body.dark input, body.dark textarea{background:#0d2139;color:#fff2d7}
body.dark .controls, body.dark .ribbon{background:#0a1a30;color:#fff2d7}
body.dark .source,body.dark label,body.dark .ref,body.dark .panel h3,body.dark .verse{color:#fff2d7}
body.dark .divider:after{background:#0d2139}
html.obs body{padding:0;background:#061526}
html.obs .shell{max-width:none;border:0;border-radius:0;box-shadow:none}
html.obs .controls,html.obs .side,html.obs .footer{display:none!important}
html.obs .hero{grid-template-columns:180px 1fr;padding:16px 24px}
html.obs .verseCard{display:none}
html.obs .logo{width:150px;height:150px}
html.obs h1{font-size:58px}
html.obs .subtitle{font-size:22px;margin-bottom:10px}
html.obs .ribbon{display:block;padding:9px}
html.obs .layout{display:block;padding:0;background:#fff7e6}
html.obs .scripture{border-radius:0;border-left:0;border-right:0;min-height:calc(100vh - 245px);padding:42px 90px}
html.obs .verse{font-size:31px;line-height:1.65}
html.obs .actions{display:none}
@media(max-width:1050px){.hero{grid-template-columns:1fr;text-align:center}.verseCard{display:none}.controls{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{order:2}h1{font-size:56px}.logo{width:190px;height:190px}}
@media(max-width:650px){body{padding:0}.shell{border-radius:0;border-left:0;border-right:0}.hero{padding:18px 14px}h1{font-size:42px}.subtitle{font-size:20px}.eyebrow{letter-spacing:5px}.controls{grid-template-columns:1fr;padding:16px}.layout{padding:16px}.scripture{padding:26px 24px}.verse{font-size:21px}.ref{font-size:25px}.ribbon{letter-spacing:3px;font-size:12px}.navArrow{display:none}}
</style>
</head>
