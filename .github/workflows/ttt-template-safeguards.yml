name: To The Throne template safeguards
on:
  push:
    branches: [main]
    paths:
      - "assets/to-the-throne/templates/**"
      - ".github/workflows/ttt-template-safeguards.yml"
  pull_request:
    paths:
      - "assets/to-the-throne/templates/**"
      - ".github/workflows/ttt-template-safeguards.yml"
jobs:
  synthetic-template-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install render/test dependencies
        run: pip install -r assets/to-the-throne/templates/requirements.txt
      - name: Test PDF integrity and evidence fields
        run: python assets/to-the-throne/templates/test_pipeline.py
      - name: Test Monday and Wednesday masters and final-output blocking
        run: |
          python assets/to-the-throne/templates/test_locked_graphics.py \
            assets/to-the-throne/weekly-graphics/2026-10-26/ttt-0001-weekly-letter.png \
            assets/to-the-throne/weekly-graphics/2026-10-26/ttt-0001-wednesday-intercession.png
      - name: Test Praise, Persecuted Church, and Faith Friday masters
        run: python assets/to-the-throne/templates/test_special_graphics.py

      - name: Run full draft integration from one canonical weekly record
        run: python assets/to-the-throne/templates/test_integrated_draft.py
      - name: Reject incomplete or unauthorized weekly releases
        run: python assets/to-the-throne/templates/test_archive_release_gate.py
      - name: Validate editable Persecuted Church vector text layers
        run: python assets/to-the-throne/templates/test_layered_persecuted.py
      - name: Verify all four social-share originals and authorized micro-edits
        run: python assets/to-the-throne/templates/test_social_share_safe.py
      - name: Build five-family draft review package and verify four social-share masters
        run: python assets/to-the-throne/templates/build_all_previews.py --out /tmp/ttt-synthetic-previews
      - name: Validate layered editable SVG candidates for all four other formats
        run: python assets/to-the-throne/templates/test_layered_other.py
      - name: Export four additional editable SVG drafts for design review
        run: |
          for kind in monday wednesday praise faith; do
            python assets/to-the-throne/templates/layered_other.py \
              assets/to-the-throne/templates/samples/${kind}-render-test.json \
              --out /tmp/ttt-synthetic-previews/${kind}-editable-DRAFT.svg
          done
      - name: Generate editable Persecuted Church SVG draft for design review
        run: |
          python assets/to-the-throne/templates/layered_persecuted.py \
            assets/to-the-throne/templates/samples/persecuted-render-test.json \
            --out /tmp/ttt-synthetic-previews/persecuted-editable-DRAFT.svg
      - name: Compare all five draft layouts against exact approved graphic masters
        run: |
          python assets/to-the-throne/templates/visual_acceptance.py \
            --drafts /tmp/ttt-synthetic-previews \
            --out /tmp/ttt-synthetic-previews/visual-qa
      - name: Upload synthetic preview package for design QA only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttt-synthetic-visual-qa-do-not-publish
          path: /tmp/ttt-synthetic-previews/
          if-no-files-found: warn
          retention-days: 7
